[workspace]
resolver = "2"
members = [
    "crates/must-cli",
    "crates/must-config",
    "crates/must-graph",
    "crates/must-engine",
    "crates/must-cache",
    "crates/must-recipe-shell",
    "crates/must-recipe-rust",
    "crates/must-recipe-go",
    "crates/must-core",
    "crates/must-toolchain",
    "crates/must-recipe-cc",
    "crates/must-import",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Greg"]
repository = "https://github.com/gregnazario/mustfile"

[workspace.dependencies]
thiserror = "2"
sled = "0.34"
sha2 = "0.11"
hex = "0.4"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
toml = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
glob = "0.3"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
