[workspace]
resolver = "2"
members = [
    "crates/must-cli",
    "crates/must-config",
    "crates/must-graph",
    "crates/must-engine",
    "crates/must-cache",
    "crates/must-recipe-shell",
    "crates/must-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Greg"]

[workspace.dependencies]
thiserror = "2"
sled = "0.34"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
