name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How to trigger the bug
      placeholder: |
        1. Create a Mustfile.toml with...
        2. Run `must build`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened (include error output)
    validations:
      required: true
  - type: textarea
    id: mustfile
    attributes:
      label: Mustfile.toml
      description: The relevant Mustfile.toml content (or a minimal reproduction)
      render: toml
  - type: input
    id: version
    attributes:
      label: must version
      description: Output of `must --version` or commit hash
      placeholder: "e.g. 0.2.0 or abc1234"
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other relevant information (logs, screenshots, etc.)
