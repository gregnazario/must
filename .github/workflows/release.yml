name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: must-x86_64-linux
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: must-aarch64-linux
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: must-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: must-aarch64-macos
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: must-x86_64-windows
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2.7.8
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }} -p must-cli
      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p must-cli
      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: tar -czf must-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release must
      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../must-${{ matrix.target }}.zip must.exe
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: must-${{ matrix.target }}
          path: |
            must-${{ matrix.target }}.tar.gz
            must-${{ matrix.target }}.zip

  checksums:
    name: Generate Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: must-*
      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} release-assets/ \;
      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum *.tar.gz *.zip > ../SHA256SUMS
          mv ../SHA256SUMS .
      - name: Upload checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checksums
          path: release-assets/SHA256SUMS

  release:
    name: Create Release
    needs: [build, checksums]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: must-*
      - name: Flatten release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name 'SHA256SUMS' \) -exec mv {} release-assets/ \;
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## Install

            **macOS / Linux:**
            ```sh
            curl -fsSL https://github.com/anomalyco/mustfile/releases/latest/download/install.sh | sh
            ```

            **Windows:**
            Download `must-x86_64-pc-windows-msvc.zip` from the assets below.

            **With Homebrew:**
            ```sh
            brew tap anomalyco/tap
            brew install must
            ```

            ## Checksums

            See `SHA256SUMS` in the release assets.

  install-script:
    name: Upload Install Script
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Upload install.sh as release asset
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: install.sh
