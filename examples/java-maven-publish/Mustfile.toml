# Java library publishing example.
# Demonstrates: java-bin/java-test + Gradle publishing to Maven Central.
#
# Project layout:
#   build.gradle       Gradle build file
#   settings.gradle    Gradle settings
#   src/main/java/     Java source
#   src/test/java/     JUnit tests

[project]
name = "my-java-lib"
version = "1.0.0"

[env]
ORG_GRADLE_PROJECT_signingKey      = ""
ORG_GRADLE_PROJECT_signingPassword = ""

[env.ci]
ORG_GRADLE_PROJECT_signingKey      = "${SIGNING_KEY}"
ORG_GRADLE_PROJECT_signingPassword = "${SIGNING_PASSWORD}"

# ── Build ──────────────────────────────────────────────────────────────────────

[recipe.build]
type    = "java-bin"
package = "."

[recipe.test]
type    = "java-test"
package = "."
deps    = ["build"]

[recipe.integration-test]
type   = "shell"
deps   = ["build"]
phony  = true
script = "./gradlew integrationTest"

# ── Code quality ───────────────────────────────────────────────────────────────

[recipe.checkstyle]
type   = "shell"
phony  = true
script = "./gradlew checkstyleMain checkstyleTest"

[recipe.spotbugs]
type   = "shell"
phony  = true
script = "./gradlew spotbugsMain"

[recipe.pmd]
type   = "shell"
phony  = true
script = "./gradlew pmdMain"

# ── Documentation ──────────────────────────────────────────────────────────────

[recipe.javadoc]
type   = "shell"
deps   = ["build"]
phony  = true
script = "./gradlew javadoc"

# ── Packaging ──────────────────────────────────────────────────────────────────

[recipe.sources-jar]
type   = "shell"
deps   = ["build"]
phony  = true
script = "./gradlew sourcesJar"

[recipe.javadoc-jar]
type   = "shell"
deps   = ["javadoc"]
phony  = true
script = "./gradlew javadocJar"

# ── Publishing ────────────────────────────────────────────────────────────────

[recipe.publish-local]
type   = "shell"
deps   = ["test", "sources-jar", "javadoc-jar"]
phony  = true
script = "./gradlew publishToMavenLocal"

[recipe.publish-snapshot]
type   = "shell"
deps   = ["test", "checkstyle", "sources-jar", "javadoc-jar"]
phony  = true
script = "./gradlew publish -Psnapshot=true"

[recipe.publish]
type   = "shell"
deps   = ["test", "checkstyle", "spotbugs", "sources-jar", "javadoc-jar"]
phony  = true
script = "./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository"

# ── Versioning ────────────────────────────────────────────────────────────────

[recipe.bump-patch]
type   = "shell"
phony  = true
script = "./gradlew patchVersion"

[recipe.bump-minor]
type   = "shell"
phony  = true
script = "./gradlew minorVersion"

[recipe.bump-major]
type   = "shell"
phony  = true
script = "./gradlew majorVersion"

# ── CI ────────────────────────────────────────────────────────────────────────

[recipe.ci]
type   = "shell"
deps   = ["checkstyle", "spotbugs", "pmd", "test"]
phony  = true
script = "echo 'All checks passed'"

[recipe.release]
type   = "shell"
deps   = ["ci", "publish"]
phony  = true
script = "echo 'Release complete'"

[recipe.clean]
type   = "shell"
phony  = true
script = "./gradlew clean"
