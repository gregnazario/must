[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "data-pipeline"
version = "1.0.0"
description = "A simple data pipeline service"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
