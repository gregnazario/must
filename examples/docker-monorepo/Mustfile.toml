# Docker monorepo example.
# Demonstrates: docker-build, docker-push for a multi-service architecture.

[project]
name = "microservices"
version = "2.0.0"

[env]
REGISTRY = "ghcr.io/myorg"

[recipe.api-image]
type       = "docker-build"
image      = "{{ env.REGISTRY }}/api:latest"
dockerfile = "services/api/Dockerfile"
package    = "."

[recipe.web-image]
type       = "docker-build"
image      = "{{ env.REGISTRY }}/web:latest"
dockerfile = "services/web/Dockerfile"
package    = "."

[recipe.worker-image]
type       = "docker-build"
image      = "{{ env.REGISTRY }}/worker:latest"
dockerfile = "services/worker/Dockerfile"
package    = "."

[recipe.push-api]
type    = "docker-push"
image   = "{{ env.REGISTRY }}/api:latest"
deps    = ["api-image"]

[recipe.push-web]
type    = "docker-push"
image   = "{{ env.REGISTRY }}/web:latest"
deps    = ["web-image"]

[recipe.push-worker]
type    = "docker-push"
image   = "{{ env.REGISTRY }}/worker:latest"
deps    = ["worker-image"]

[recipe.push-all]
type   = "shell"
deps   = ["push-api", "push-web", "push-worker"]
phony  = true
script = "echo All images pushed"

[recipe.test-api]
type   = "shell"
phony  = true
script = "docker run --rm {{ env.REGISTRY }}/api:latest /app/test"

[recipe.ci]
type   = "shell"
deps   = ["api-image", "web-image", "worker-image"]
phony  = true
script = "echo All images built"
