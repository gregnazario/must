[package]
name = "must-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "must"
path = "src/main.rs"

[dependencies]
must-core = { path = "../must-core" }
must-config = { path = "../must-config" }
must-graph = { path = "../must-graph" }
must-engine = { path = "../must-engine" }
must-recipe-shell = { path = "../must-recipe-shell" }
must-recipe-rust = { path = "../must-recipe-rust" }
must-recipe-go = { path = "../must-recipe-go" }
must-recipe-cc = { path = "../must-recipe-cc" }
must-recipe-ts = { path = "../must-recipe-ts" }
must-cache = { path = "../must-cache" }
must-import = { path = "../must-import" }
must-toolchain = { path = "../must-toolchain" }
clap.workspace = true
clap_complete.workspace = true
glob.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/must-{ target }.tar.gz"
bin-dir = "must{ binary-ext }"
pkg-fmt = "tgz"
