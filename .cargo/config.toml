[build]
rustflags = []

[target.aarch64-apple-darwin]
linker = "clang"
rustflags = []

# Windows
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = [
  "-C",
  "link-arg=/STACK:8000000" # Set stack to 8 MB
]
[target.aarch64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = [
  "-C",
  "link-arg=/STACK:8000000" # Set stack to 8 MB
]
